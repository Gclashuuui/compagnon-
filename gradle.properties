org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric — versions a verifier sur https://fabricmc.net/develop
# Ce sont celles de "mods secret" (lhdpsecret), pour que les deux mods
# tournent sur le meme serveur.
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.17.14

# Mod
mod_version=0.1.0
maven_group=fr.lhdp.compagnon

# Dependances
fabric_api_version=0.116.13+1.21.1

# GeckoLib : c'est le PLANCHER, pas la derniere version.
# On compile contre la plus ancienne version qu'on accepte de faire tourner, et
# fabric.mod.json declare le meme chiffre. Compiler contre une version plus
# recente laisserait passer un appel qui n'existe pas chez les joueurs, et le mod
# planterait en jeu au lieu de refuser de demarrer.
# Verifie : 4.7.7, 4.8.4 et 4.9.2 ont exactement les memes signatures pour tout
# ce que le mod utilise.
geckolib_version=4.8.4

# Plasmo Voice : le chat vocal. "compileOnly" — le mod tourne tres bien sans.
plasmo_voice_version=2.1.13
# Vosk : la reconnaissance vocale, entierement hors ligne. La voix des joueurs
# ne quitte jamais le serveur.
vosk_version=0.3.45
# JNA : Vosk appelle ses binaires natifs a travers elle. "include" n'est pas
# transitif, il faut donc la nommer.
jna_version=5.14.0

# Les tests. Ils ne lancent jamais Minecraft.
junit_version=5.11.3
